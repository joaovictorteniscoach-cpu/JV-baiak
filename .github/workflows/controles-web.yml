name: Controles web (sem conta ou rede de jogo)
on:
  pull_request:
    paths: ['web/shell.html', 'testes/teste_controles_web.cjs', 'testes/teste_toque_web.py', 'testes/teste_instalador_iphone_v2.py', 'testes/teste_coordenadas_canvas.cjs', 'testes/verificar_layout_mobile.py', 'testes/verificar_paineis_toque.py', 'web/otclientrc-extra.lua', 'web/patches-final/**', 'web/instalar-correcao-iphone*.sh', '.github/workflows/controles-web.yml']
  push:
    branches: [main, codex/jogabilidade-mobile, codex/iphone-layout-toque]
    paths: ['web/shell.html', 'testes/teste_controles_web.cjs', 'testes/teste_toque_web.py', 'testes/teste_instalador_iphone_v2.py', 'testes/teste_coordenadas_canvas.cjs', 'testes/verificar_layout_mobile.py', 'testes/verificar_paineis_toque.py', 'web/otclientrc-extra.lua', 'web/patches-final/**', 'web/instalar-correcao-iphone*.sh', '.github/workflows/controles-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node testes/teste_controles_web.cjs
      - run: python -m unittest discover -s testes -p teste_instalador_iphone_v2.py
      - run: bash -n web/instalar-correcao-iphone.sh && bash -n web/instalar-correcao-iphone-v2.sh
      - name: Conferir patches e testar tradução de toque
        shell: bash
        run: |
          set -euo pipefail
          fonte="$RUNNER_TEMP/otclient-toque"
          mkdir -p "$fonte"
          git -C "$fonte" init -q
          for arquivo in src/framework/platform/browserwindow.cpp src/framework/ui/uitextedit.cpp src/client/protocolgame.cpp modules/client_locales/locales.lua modules/game_interface/gameinterface.lua modules/game_interface/gameinterface.otui modules/game_console/console.lua modules/game_shortcuts/shortcuts.otui; do
            mkdir -p "$fonte/$(dirname "$arquivo")"
            curl --fail --silent --show-error --retry 2 "https://raw.githubusercontent.com/opentibiabr/otclient/1fcea26f23ef1d1857103ef446c0190955523ca8/$arquivo" -o "$fonte/$arquivo"
          done
          for patch in "$GITHUB_WORKSPACE"/web/patches-final/*.patch; do
            git -C "$fonte" apply --check "$patch"
            git -C "$fonte" apply "$patch"
          done
          python testes/teste_toque_web.py "$fonte"
          node testes/teste_coordenadas_canvas.cjs "$fonte"
          python -m pip install lupa==2.6
          python testes/verificar_layout_mobile.py "$fonte"
          python testes/verificar_paineis_toque.py
