# JV Baiak - robo que tenta criar a VPS gratis da Oracle ate conseguir.
# Cada execucao tenta a cada 2 minutos por ~45 minutos e depois dispara a
# proxima sozinha (nao depende do agendamento do GitHub, que pode atrasar).
# So faz algo depois que o segredo OCI_JVBAIAK for cadastrado no repositorio.
# Quando consegue, avisa na issue "Robô da Oracle" e se desliga sozinho.
name: Criar VPS Oracle (robô)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/criar-vps-oracle.yml"
      - "oracle/criar_vps.py"
  schedule:
    - cron: "*/30 * * * *"   # reserva: religa a corrente se ela parar
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: criar-vps-oracle
  cancel-in-progress: false

jobs:
  tentar:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - name: Verificar segredo
        id: segredo
        env:
          OCI_JVBAIAK: ${{ secrets.OCI_JVBAIAK }}
        run: |
          if [ -n "$OCI_JVBAIAK" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "Segredo OCI_JVBAIAK ainda nao cadastrado."; fi

      - uses: actions/checkout@v4
        if: steps.segredo.outputs.ok == '1'

      - uses: actions/setup-python@v5
        if: steps.segredo.outputs.ok == '1'
        with:
          python-version: "3.12"

      - name: Instalar SDK da Oracle
        if: steps.segredo.outputs.ok == '1'
        run: pip install --quiet "oci>=2.120,<3"

      - name: Tentar criar a VPS
        id: tentar
        if: steps.segredo.outputs.ok == '1'
        env:
          OCI_JVBAIAK: ${{ secrets.OCI_JVBAIAK }}
          GITHUB_TOKEN: ${{ github.token }}
          DURACAO_MIN: "45"
          SEM_DOMINIO: "1"   # o dominio bayakjh fica com o Google Cloud
          INTERVALO_S: "120"
        run: python oracle/criar_vps.py

      - name: Disparar a próxima execução
        if: steps.tentar.outputs.continuar == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run criar-vps-oracle.yml --ref main --repo "$GITHUB_REPOSITORY"
