# JV Baiak - todos os servicos do servidor.
# Os valores ${...} vem do arquivo .env, gerado pelo instalador (senhas aleatorias).
name: jvbaiak

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    # Modo nao estrito: o TFS 1.3 foi escrito para o MySQL classico.
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    environment:
      MARIADB_DATABASE: jvbaiak
      MARIADB_USER: jvbaiak
      MARIADB_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env}
      MARIADB_ROOT_PASSWORD: ${DB_SENHA_ROOT:?defina DB_SENHA_ROOT no .env}
      TZ: America/Sao_Paulo
    volumes:
      - banco:/var/lib/mysql
      - ./servidor/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30

  servidor:
    build: ./servidor-imagem
    image: jvbaiak/servidor:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7171:7171"
      - "7172:7172"
    volumes:
      - ./servidor:/srv
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  portal:
    build: ./portal
    image: jvbaiak/portal:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8000"
    environment:
      DB_HOST: db
      DB_NOME: jvbaiak
      DB_USUARIO: jvbaiak
      DB_SENHA: ${DB_SENHA}
      PORTAL_SEGREDO: ${PORTAL_SEGREDO:?defina PORTAL_SEGREDO no .env}
      NOME_SERVIDOR: ${NOME_SERVIDOR:-JV Baiak}
      ENDERECO_SERVIDOR: ${ENDERECO_SERVIDOR:?defina ENDERECO_SERVIDOR no .env}
      SERVIDOR_JOGO: servidor
      TZ: America/Sao_Paulo
    volumes:
      - ./downloads:/app/downloads:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Ferramenta (nao fica rodando): gera os clientes Windows e Android.
  # Uso: docker compose run --rm clientes
  clientes:
    build: ./clientes
    image: jvbaiak/clientes:local
    profiles: ["ferramentas"]
    environment:
      ENDERECO_SERVIDOR: ${ENDERECO_SERVIDOR}
      NOME_SERVIDOR: ${NOME_SERVIDOR:-JV Baiak}
      APK_SENHA: ${APK_SENHA:?defina APK_SENHA no .env}
    volumes:
      - ./downloads:/saida
      - ./clientes-cache:/cache

volumes:
  banco:
