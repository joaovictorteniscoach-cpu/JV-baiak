{% extends "base.html" %}
{% block titulo %}Entrar — {{ nome_servidor }}{% endblock %}
{% block conteudo %}
<h1>Minha conta</h1>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="form" action="{{ url_for('conta') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Conta
    <input name="conta" required maxlength="20" autocapitalize="none" autocomplete="username" value="{{ nome }}">
  </label>
  <label>Senha
    <input name="senha" type="password" required maxlength="29" autocomplete="current-password">
  </label>
  <button class="botao" type="submit">Entrar</button>
</form>
<p class="dica">Ainda não tem conta? <a href="{{ url_for('criar_conta') }}">Criar conta grátis</a></p>
{% endblock %}
