{% extends "base.html" %}
{% block titulo %}Criar conta - {{ nome_servidor }}{% endblock %}
{% block conteudo %}
<h1>Criar conta</h1>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Conta (login)
    <input name="conta" required minlength="4" maxlength="20" autocapitalize="none" autocomplete="username" value="{{ f.get('conta', '') }}">
  </label>
  <label>Senha
    <input name="senha" type="password" required minlength="6" maxlength="29" autocomplete="new-password">
  </label>
  <label>Repita a senha
    <input name="senha2" type="password" required minlength="6" maxlength="29" autocomplete="new-password">
  </label>
  <label>E-mail (opcional)
    <input name="email" type="email" maxlength="255" autocomplete="email" value="{{ f.get('email', '') }}">
  </label>
  {% include "_personagem.html" %}
  <button class="botao" type="submit">Criar conta</button>
</form>
{% endblock %}
