<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!-- JV Baiak: pagina do jogo no navegador (iPhone, Android e PC). Baseada no shell do OTClient Redemption. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="__JV_NOME__" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icone-180.png" />
    <title>__JV_NOME__</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background-color: #000;
        overscroll-behavior: none;
        overflow: hidden;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .backbuffer {
        position: fixed;
        inset: 0;
        margin: 0;
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        /* o jogo desenha em ate 2x a resolucao da tela; suavizar o resto fica melhor que serrilhar */
        image-rendering: auto;
      }
      .title {
        pointer-events: none;
        position: absolute;
        top: 10px;
        padding-left: 10px;
        color: #f1e0c6;
        z-index: 1;
        font: 16px Georgia, "Times New Roman", serif;
      }
      #capa {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        text-align: center;
        color: #f1e0c6;
        font: 17px/1.4 Georgia, "Times New Roman", serif;
        background:
          radial-gradient(ellipse at 50% 30%, rgba(224, 176, 74, .18), transparent 60%),
          #17120d;
      }
      #capa h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: .08em;
        color: #e0b04a;
        text-shadow: 0 2px 0 #000;
      }
      #capa p { margin: 0; max-width: 30em; color: #d8c7a6; }
      #progresso {
        width: min(320px, 80vw);
        height: 10px;
        border-radius: 5px;
        background: #000;
        border: 1px solid #6a4424;
        overflow: hidden;
      }
      #progresso div { height: 100%; width: 0; background: linear-gradient(90deg, #a9781f, #e0b04a); transition: width .3s; }
      #start {
        display: none;
        font: 700 1.3rem Georgia, serif;
        letter-spacing: .06em;
        padding: 14px 38px;
        border-radius: 8px;
        color: #2a1704;
        background: linear-gradient(180deg, #f4cf73, #e0b04a 45%, #b98322);
        border: 1px solid #5a3a0c;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 3px 0 #000;
      }
      #girar {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 4;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        padding: 24px;
        text-align: center;
        color: #f1e0c6;
        font: 18px/1.4 Georgia, serif;
        background: rgba(10, 8, 6, .94);
      }
      #girar .icone { font-size: 48px; }
      #girar button {
        font: 15px Georgia, serif;
        color: #e0b04a;
        background: transparent;
        border: 1px solid #a9781f;
        border-radius: 6px;
        padding: 8px 16px;
      }
      @media (orientation: portrait) and (max-width: 820px) {
        body:not(.retrato-ok) #girar { display: flex; }
      }
    </style>
  </head>
  <body>
    <div class="title" id="title-text" contenteditable virtualkeyboardpolicy="manual"></div>
    <div id="capa">
      <h1>__JV_NOME__</h1>
      <p id="capa-texto">Baixando o jogo...</p>
      <div id="progresso"><div></div></div>
      <button id="start" onclick="startGame()">Jogar</button>
      <p id="capa-dica">Na primeira vez baixa uns 60 MB; depois abre na hora.</p>
    </div>
    <div id="girar">
      <div class="icone">&#8635;</div>
      <div>Deite o celular para jogar.</div>
      <div style="font-size:14px;color:#b9a582">Dica: no Safari, Compartilhar &rarr; Adicionar &agrave; Tela de In&iacute;cio abre o jogo em tela cheia.</div>
      <button onclick="document.body.classList.add('retrato-ok')">Continuar assim</button>
    </div>
    <canvas class="backbuffer" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <script type="text/javascript">
      var canvas = document.getElementById("canvas");
      var capaTexto = document.getElementById("capa-texto");
      var barra = document.querySelector("#progresso div");
      function reportRuntimeError(prefix, error) {
        const payload = [prefix, error]
          .flat()
          .filter(Boolean)
          .map((entry) => {
            if (!entry) return "";
            if (typeof entry === "string") return entry;
            if (entry.stack) return entry.stack;
            try { return JSON.stringify(entry); } catch (_) { return String(entry); }
          })
          .join(": ");
        console.error(payload);
      }
      function startGame() {
        document.getElementById("capa").style.display = "none";
        callMain();
        ["touchstart", "touchmove", "touchend", "touchcancel"].forEach(function (tipo) {
          document.addEventListener(tipo, function (ev) {
            ev.preventDefault();
            ev.stopPropagation();
          }, { passive: false });
        });
        // iOS: impede o zoom de dois toques e o gesto de pinça
        document.addEventListener("gesturestart", function (ev) { ev.preventDefault(); }, { passive: false });
        document.addEventListener("keyup", function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
        });
        document.addEventListener("keydown", function (ev) {
          if (
            !ev.ctrlKey &&
            ev.key !== "Enter" &&
            ev.key !== "Escape" &&
            ev.key !== "Backspace" &&
            ev.key !== "ArrowLeft" &&
            ev.key !== "ArrowRight" &&
            ev.key !== "ArrowUp" &&
            ev.key !== "ArrowDown"
          ) {
            canvas.dispatchEvent(new KeyboardEvent("keypress", ev));
          } else if (ev.ctrlKey && ev.key === "v") {
            return true;
          }
          ev.preventDefault();
          ev.stopPropagation();
        });
      }
      var Module = {
        locateFile: function (path) {
          const baseURL =
            window.location.origin +
            window.location.pathname.substring(0, window.location.pathname.lastIndexOf("/"));
          return baseURL + "/" + path;
        },
        preRun: [
          function () {
            addRunDependency("syncfs");
            if (!FS.analyzePath("/user").exists) FS.mkdir("/user");
            FS.mount(IDBFS, { autoPersist: true }, "/user");
            FS.syncfs(true, function (err) {
              if (err) Module.print(err);
              removeRunDependency("syncfs");
            });
          },
        ],
        postRun: [],
        print: function () {
          console.log(Array.prototype.slice.call(arguments).join(" "));
        },
        printErr: function () {
          reportRuntimeError("stderr", Array.prototype.slice.call(arguments).join(" "));
        },
        canvas: canvas,
        onAbort: function (reason) {
          reportRuntimeError("abort", reason || "unknown reason");
          capaTexto.textContent = "O jogo travou. Recarregue a pagina.";
          document.getElementById("capa").style.display = "flex";
        },
        setStatus: function (text) {
          console.log("status: " + text);
          var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);
          if (m) {
            var pct = Math.round((parseFloat(m[1]) / parseFloat(m[3])) * 100);
            barra.style.width = pct + "%";
            capaTexto.textContent = "Baixando o jogo... " + pct + "%";
          }
          if (text.includes("Running...")) {
            barra.style.width = "100%";
            capaTexto.textContent = "Pronto!";
            document.getElementById("progresso").style.display = "none";
            document.getElementById("capa-dica").textContent = "Toque em Jogar. Segure o dedo para o menu (botao direito).";
            document.getElementById("start").style.display = "block";
          }
        },
        monitorRunDependencies: function (left) {
          if (left > 0 && !capaTexto.textContent.startsWith("Baixando")) capaTexto.textContent = "Preparando...";
        },
      };
      window.onerror = function (message, source, lineno, colno, error) {
        reportRuntimeError("window.onerror", error || message);
      };
      window.addEventListener("unhandledrejection", function (event) {
        reportRuntimeError("unhandledrejection", event.reason || "Promise rejected");
      });
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
